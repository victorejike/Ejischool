apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejischool-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ejischool-api
  template:
    metadata:
      labels:
        app: ejischool-api
    spec:
      containers:
        - name: api
          image: ejischool/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ejischool-api
spec:
  selector:
    app: ejischool-api
  ports:
    - port: 8080
      targetPort: 8080
