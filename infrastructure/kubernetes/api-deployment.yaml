apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejischool-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ejischool-api
  template:
    metadata:
      labels:
        app: ejischool-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/ejischool-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: APP_ENV
              value: "production"
            - name: JWT_ISSUER
              value: "ejischool-api"
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ejischool-config
                  key: allowed-origins
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ejischool-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ejischool-secrets
                  key: jwt-secret
            - name: ADMIN_SIGNUP_CODE
              valueFrom:
                secretKeyRef:
                  name: ejischool-secrets
                  key: admin-signup-code
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ejischool-api
spec:
  selector:
    app: ejischool-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejischool-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ejischool-web
  template:
    metadata:
      labels:
        app: ejischool-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/ejischool-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: ejischool-config
                  key: public-api-url
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ejischool-web
spec:
  selector:
    app: ejischool-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ejischool-config
data:
  public-api-url: "https://api.ejicode.com"
  allowed-origins: "https://ejischool.ejicode.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: ejischool-secrets
type: Opaque
stringData:
  database-url: "postgres://USER:PASSWORD@HOST:5432/ejischool?sslmode=require"
  jwt-secret: "replace-with-a-long-random-secret-at-least-32-characters"
  admin-signup-code: "replace-with-a-private-admin-invite-code"
