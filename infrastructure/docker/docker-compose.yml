services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      APP_ENV: docker
      DATABASE_URL: postgres://ejischool:ejischool@postgres:5432/ejischool?sslmode=disable
      JWT_SECRET: local-docker-only-change-before-production
      ADMIN_SIGNUP_CODE: local-admin
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ejischool
      POSTGRES_PASSWORD: ejischool
      POSTGRES_DB: ejischool
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../packages/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
